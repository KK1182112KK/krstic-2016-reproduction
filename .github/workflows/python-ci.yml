name: Python Tests

on:
  push:
    branches: [master, main]
    paths: ['python/**', 'state-delay-2012/**', '.github/workflows/python-ci.yml']
  pull_request:
    branches: [master, main]
    paths: ['python/**', 'state-delay-2012/**', '.github/workflows/python-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies and record environment
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt nbconvert ipykernel
          mkdir -p results/ci
          python --version > results/ci/python-version.txt
          pip freeze > results/ci/requirements-resolved.txt
          git rev-parse HEAD > results/ci/commit.txt
      - name: Run all Python tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest python/tests/ -q --color=no --junitxml=results/ci/python-tests.xml | tee results/ci/python-tests.log
      - name: Archive delayed-switch regression
        run: python python/run_boundary_validation.py --out results/ci/boundary
      - name: Execute notebook
        if: matrix.python-version == '3.13'
        run: jupyter nbconvert --to notebook --execute python/notebook.ipynb --ExecutePreprocessor.timeout=900 --output executed.ipynb --output-dir results/ci
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-verification-${{ matrix.python-version }}
          path: |
            results/ci/
            results/direct-dde/
          retention-days: 30
