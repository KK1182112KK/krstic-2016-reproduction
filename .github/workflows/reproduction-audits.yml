name: Reproduction audit tests

on:
  push:
    branches: [master]
    paths:
      - 'artstein-1982-reproduction/**'
      - 'bekiaris-liberis-krstic-2017-reproduction/**'
      - 'zhao-2022-reproduction/**'
      - '.github/workflows/reproduction-audits.yml'
  pull_request:
    branches: [master]
    paths:
      - 'artstein-1982-reproduction/**'
      - 'bekiaris-liberis-krstic-2017-reproduction/**'
      - 'zhao-2022-reproduction/**'
      - '.github/workflows/reproduction-audits.yml'

jobs:
  artstein-1982:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artstein-1982-reproduction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: artstein-1982-reproduction/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q test_audit.py
      - run: python audit.py --out ci-results
      - uses: actions/upload-artifact@v4
        with:
          name: artstein-1982-ci-results
          path: artstein-1982-reproduction/ci-results
          retention-days: 7

  bekiaris-liberis-krstic-2017:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bekiaris-liberis-krstic-2017-reproduction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: bekiaris-liberis-krstic-2017-reproduction/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q test_audit.py
      - run: python audit.py --out ci-results
      - uses: actions/upload-artifact@v4
        with:
          name: bekiaris-liberis-krstic-2017-ci-results
          path: bekiaris-liberis-krstic-2017-reproduction/ci-results
          retention-days: 7

  zhao-2022:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhao-2022-reproduction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: zhao-2022-reproduction/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q test_audit.py
