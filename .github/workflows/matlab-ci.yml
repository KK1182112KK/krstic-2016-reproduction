name: MATLAB Tests

on:
  push:
    branches: [master, main]
    paths: ['matlab/**', '.github/workflows/matlab-ci.yml']
  pull_request:
    branches: [master, main]
    paths: ['matlab/**', '.github/workflows/matlab-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
      - name: Run all MATLAB tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: matlab/src
          select-by-folder: matlab/tests
          test-results-junit: results/ci/matlab-results.xml
      - name: Run original-plant validation and record release
        uses: matlab-actions/run-command@v2
        with:
          command: "disp(version); cd('matlab'); run_all('sim');"
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-verification
          path: |
            results/ci/
            matlab/results/direct-dde/
          retention-days: 30
